name: CI/CD Frontend — Build → Push → Deploy

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout código
        uses: actions/checkout@v3

      - name: 🔐 Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🐳 Build y Push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/front-eval2:latest

      - name: 🚀 Deploy en EC2 Frontend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/front-eval2:latest

            docker stop front-eval2 || true
            docker rm front-eval2 || true

            docker run -d \
              --name front-eval2 \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/front-eval2:latest